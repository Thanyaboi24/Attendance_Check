# Alternative to Caddy, for a server that already runs nginx.
# Copy the admin website (web/dist in the installation package) to /var/www/siitatt and run the API on 127.0.0.1:3000
# (the `postgres` and `api` services of the package's docker-compose.yml; see deploy/README.md).
# HTTPS certificate: sudo certbot --nginx -d siitatt.bsoftsolutions.net

server {
    listen 80;
    listen [::]:80;
    server_name siitatt.bsoftsolutions.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name siitatt.bsoftsolutions.net;

    ssl_certificate     /etc/letsencrypt/live/siitatt.bsoftsolutions.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siitatt.bsoftsolutions.net/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API (same origin as the admin website)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # Admin website (single-page app)
    root /var/www/siitatt;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
